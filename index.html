<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f"><title>Anggaran</title>
<style>
:root{--bg:#eef1f0;--c:#fff;--t:#16202a;--m:#6b7782;--a:#1f3a5f;--l:#dde3e1;--ng:#b3261e;--ok:#2e7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--c:#19222b;--t:#e8edf0;--m:#8a97a2;--a:#7fa6d6;--l:#2a3641;--ng:#ff8a80;--ok:#6fcf97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:0 12px 84px;max-width:560px;margin:auto;font-variant-numeric:tabular-nums}
h1{font-size:34px;margin:2px 0;letter-spacing:-1px;color:var(--a)}h3{margin:0 0 8px}small,.m{color:var(--m)}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin:10px 0}
.top{padding:10px 0 0}select,input{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:3px 0 8px}
label{display:block;font-size:13px;color:var(--m)}.top select{width:auto}
button{background:var(--a);color:var(--c);border:0;border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;flex:1}
button.g{background:transparent;color:var(--a);border:1px solid var(--l)}button.s{padding:4px 8px;flex:none;font-size:13px}
.row{display:flex;gap:8px;margin:10px 0}.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--l)}.li:first-of-type{border:0}
.r{text-align:right}.neg{color:var(--ng)}.pos{color:var(--ok)}.warn{background:var(--c);border-left:4px solid var(--ng);padding:8px 10px;margin:10px 0;font-size:13px}
.bar{height:8px;background:var(--l);border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.chips button{flex:none;background:var(--c);color:var(--t);border:1px solid var(--l);padding:6px 12px}.chips .on{background:var(--a);color:var(--c)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;font-size:12px;padding:14px 2px}nav .on{color:var(--a);box-shadow:inset 0 3px var(--a)}
.bk{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}.bk .card{width:100%;max-width:560px;margin:0;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto}
</style></head><body>
<main id="v"></main><nav id="nav"></nav><div id="sh"></div>
<script>
const K='budget_v1',$=s=>document.querySelector(s);
let S=JSON.parse(localStorage.getItem(K)||'null')||{sources:[{id:'cash',n:'Tunai'},{id:'bank',n:'Bank'}],months:{},bk:0};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n?n.toLocaleString('id-ID'):'',rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'),num=x=>+String(x).replace(/\D/g,'')||0;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ym0=()=>today().slice(0,7);
let V,T='home',TC='';
const blankF=()=>({q:'',s:'',ty:'',d1:'',d2:''});let TF=blankF();
const mlabel=k=>['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+k.slice(5)-1]+' '+k.slice(0,4);
const M=()=>S.months[V],dd=()=>V==ym0()?today():V+'-01';
const sn=id=>(S.sources.find(s=>s.id==id)||{}).n||'?',SO=()=>S.sources.map(s=>[s.id,s.n]);
const cn=id=>(M().cats.find(c=>c.id==id)||{}).n||'-';
const bal=(m,s)=>(m.op[s]||0)+m.adj.filter(a=>a.s==s).reduce((t,a)=>t+a.to-a.from,0)+m.tx.filter(t=>t.s==s).reduce((t,x)=>t+(x.ty=='in'?x.a:-x.a),0)+m.tr.reduce((t,x)=>t+(x.to==s?x.a:0)-(x.from==s?x.a:0),0);
const rsv=(m,s)=>m.res.filter(r=>!s||r.s==s).reduce((t,r)=>t+r.a,0);
const spent=(m,c)=>m.tx.filter(t=>t.ty=='out'&&(!c||t.c==c)).reduce((t,x)=>t+x.a,0);
const planned=(m,c)=>m.plans.filter(p=>p.c==c).reduce((t,x)=>t+x.a,0);
const avail=(m,s)=>bal(m,s)-rsv(m,s);

function newMonth(ym,copy){
 const pk=Object.keys(S.months).filter(k=>k<ym).sort().pop(),p=S.months[pk];
 const m={op:{},tb:0,bh:[],cats:[],plans:[],res:[],tx:[],tr:[],adj:[]};
 if(p)S.sources.forEach(s=>m.op[s.id]=bal(p,s.id));
 if(p&&copy){m.tb=p.tb;m.cats=JSON.parse(JSON.stringify(p.cats));m.plans=p.plans.map(x=>({id:uid(),c:x.c,n:x.n,a:x.a,st:0}));m.res=JSON.parse(JSON.stringify(p.res))}
 else m.cats=[{id:uid(),n:'Utilitas',b:0},{id:uid(),n:'Makanan',b:0}];
 S.months[ym]=m;V=ym;save()}

function modal(h){$('#sh').innerHTML='<div class="bk"><div class="card">'+h+'</div></div>'}
const close=()=>$('#sh').innerHTML='';
function sheet(t,F,ok,init){
 modal(`<form><h3>${t}</h3>${F.map(f=>`<label>${f.l}${f.t=='sel'?`<select name="${f.k}">${(f.o||[]).map(o=>`<option value="${o[0]}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" ${f.t=='num'?'inputmode="numeric" class="num"':'type="'+(f.t||'text')+'"'} value="${esc(f.t=='num'?fmt(f.v||0):f.v)}">`}</label>`).join('')}<div class="row"><button type="button" class="g" data-a="close">Batal</button><button>Simpan</button></div></form>`);
 const fm=$('#sh form');if(init)init(fm.elements);
 fm.onsubmit=e=>{e.preventDefault();const v={};F.forEach(f=>{const x=fm.elements[f.k].value;v[f.k]=f.t=='num'?num(x):x.trim()});
  const r=ok(v);if(r===false)return;if(r)alert(r);else{close();render()}}}
document.oninput=e=>{if(e.target.classList.contains('num'))e.target.value=fmt(num(e.target.value))};
const txList=m=>{const q=TF.q.toLowerCase(),L=m.tx.filter(t=>(!TC||t.c==TC)&&(!TF.s||t.s==TF.s)&&(!TF.ty||t.ty==TF.ty)&&(!TF.d1||t.d>=TF.d1)&&(!TF.d2||t.d<=TF.d2)&&(!q||((t.l||'')+' '+(t.n||'')).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)),tot=L.reduce((t,x)=>t+(x.ty=='in'?x.a:-x.a),0);
 return `<small>${L.length} transaksi · total ${rp(tot)}</small>`+L.map(t=>`<div class="li"><span>${esc(t.l)}<br><small>${t.d} · ${esc(t.ty=='in'?'Pemasukan':cn(t.c))} · ${esc(sn(t.s))}${t.n?' · '+esc(t.n):''}</small></span><span class="r ${t.ty=='in'?'pos':''}">${t.ty=='in'?'+':'-'}${fmt(t.a)}<br><button class="s g" data-a="delTx" data-i="${t.id}">Hapus</button></span></div>`).join('')||'<p class="m">Tidak ada transaksi yang cocok.</p>'};
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){TF[f]=e.target.value;const l=$('#tl');if(l)l.innerHTML=txList(M())}});

const views={
home(m){const tb=S.sources.reduce((t,s)=>t+bal(m,s.id),0),tr=rsv(m),sp=spent(m),b=m.tb,up=m.plans.filter(p=>!p.st);
 return `<div class="card"><small>Uang bisa dipakai</small><h1>${rp(tb-tr)}</h1><small>Total ${rp(tb)}, cadangan ${rp(tr)}</small></div>
 <div class="card"><b>Anggaran bulan ini</b><span class="r" style="float:right">${rp(sp)} / ${rp(b)}</span><div class="bar"><i style="width:${b?Math.min(100,sp/b*100):0}%"></i></div><small class="${b-sp<0?'neg':''}">Sisa ${rp(b-sp)}</small></div>
 <div class="row"><button data-a="addTx">+ Keluar</button><button data-a="addIn">+ Masuk</button><button class="g" data-a="trf">Transfer</button></div>
 <div class="card"><b>Kategori</b>${m.cats.map(c=>{const s=spent(m,c.id);return `<div class="li"><span>${esc(c.n)}</span><span class="${s>c.b?'neg':''}">${rp(s)} / ${rp(c.b)}</span></div>`}).join('')||'<p class="m">Belum ada kategori.</p>'}</div>
 <div class="card"><b>Rencana belum dibayar</b>${up.map(p=>`<div class="li"><span>${esc(p.n)} <small>${esc(cn(p.c))}</small></span><span>${rp(p.a)}</span></div>`).join('')||'<p class="m">Tidak ada.</p>'}</div>`},
trx(m){return `<div class="chips"><button class="${TC?'':'on'}" data-a="tc" data-i="">Semua</button>${m.cats.map(c=>`<button class="${TC==c.id?'on':''}" data-a="tc" data-i="${c.id}">${esc(c.n)}</button>`).join('')}</div>
 <div class="row"><button data-a="addTx">+ Keluar</button><button class="g" data-a="addIn">+ Masuk</button></div>
 <div class="card"><input data-f="q" placeholder="Cari keterangan atau catatan" value="${esc(TF.q)}">
 <div class="row"><select data-f="s"><option value="">Semua sumber</option>${SO().map(o=>`<option value="${o[0]}"${TF.s==o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select><select data-f="ty"><option value="">Semua jenis</option><option value="out"${TF.ty=='out'?' selected':''}>Pengeluaran</option><option value="in"${TF.ty=='in'?' selected':''}>Pemasukan</option></select></div>
 <div class="row"><input type="date" data-f="d1" value="${TF.d1}"><input type="date" data-f="d2" value="${TF.d2}"></div><button class="s g" data-a="rf">Reset filter</button></div>
 <div class="card" id="tl">${txList(m)}</div>`},
bud(m){return `<div class="card"><small>Total anggaran bulan ini</small><h1>${rp(m.tb)}</h1><small>Dibagi ke kategori: ${rp(m.cats.reduce((t,c)=>t+c.b,0))} · selisih ${rp(m.tb-m.cats.reduce((t,c)=>t+c.b,0))}</small><div class="row"><button data-a="editTb">Ubah</button><button class="g" data-a="addCat">+ Kategori</button></div></div>`+
 m.cats.map(c=>{const pl=planned(m,c.id),sp=spent(m,c.id);return `<div class="card"><b>${esc(c.n)}</b> <span class="r" style="float:right">${rp(c.b)}</span><br><small>Rencana ${rp(pl)} · <span class="${c.b-pl<0?'neg':''}">selisih ${rp(c.b-pl)}</span> · terpakai ${rp(sp)}</small>
 ${m.plans.filter(p=>p.c==c.id).map(p=>`<div class="li"><span>${p.st?'✓':'○'} ${esc(p.n)}</span><span>${fmt(p.a)} <button class="s g" data-a="editPlan" data-i="${p.id}">Ubah</button> <button class="s g" data-a="delPlan" data-i="${p.id}">×</button></span></div>`).join('')}
 <div class="row"><button class="s" data-a="addPlan" data-i="${c.id}">+ Rencana</button><button class="s g" data-a="editCat" data-i="${c.id}">Ubah</button><button class="s g" data-a="delCat" data-i="${c.id}">Hapus</button></div></div>`}).join('')},
mon(m){return `<div class="row"><button data-a="trf">Transfer</button><button class="g" data-a="addIn">+ Masuk</button><button class="g" data-a="addBank">+ Rekening</button></div>`+
 S.sources.map(s=>`<div class="card"><b>${esc(s.n)}</b><h3>${rp(bal(m,s.id))}</h3><small>Cadangan ${rp(rsv(m,s.id))} · bisa dipakai ${rp(avail(m,s.id))}</small><div class="row"><button class="s g" data-a="editBal" data-i="${s.id}">Ubah saldo</button><button class="s g" data-a="renSrc" data-i="${s.id}">Ubah nama</button><button class="s g" data-a="delSrc" data-i="${s.id}">Hapus</button></div></div>`).join('')+
 `<div class="card"><b>Cadangan</b> <button class="s" style="float:right" data-a="addRes">+ Tambah</button>${m.res.map(r=>`<div class="li"><span>${esc(r.n)}<br><small>${esc(sn(r.s))}</small></span><span>${fmt(r.a)} <button class="s g" data-a="editRes" data-i="${r.id}">Ubah</button> <button class="s g" data-a="delRes" data-i="${r.id}">×</button></span></div>`).join('')||'<p class="m">Belum ada cadangan.</p>'}</div>`},
more(m){const H=[...m.bh.map(h=>({d:h.d,t:`Anggaran ${rp(h.f)} → ${rp(h.t)}`})),...m.adj.map(a=>({d:a.d,t:`Saldo ${sn(a.s)} ${rp(a.from)} → ${rp(a.to)}`})),...m.tr.map(x=>({d:x.d,t:`Transfer ${rp(x.a)} ${sn(x.from)} → ${sn(x.to)}`}))].sort((a,b)=>b.d.localeCompare(a.d));
 return `<div class="card"><b>Pilih bulan</b><select id="ms">${Object.keys(S.months).sort().reverse().map(k=>`<option value="${k}" ${k==V?'selected':''}>${mlabel(k)}</option>`).join('')}</select></div>
 <div class="card"><button class="g" data-a="addMonth" style="width:100%">+ Tambah bulan baru</button></div>
 <div class="card"><b>Cadangan data</b><p class="m">Terakhir: ${S.bk?new Date(S.bk).toLocaleDateString('id-ID'):'belum pernah'}</p><div class="row"><button data-a="exp">Ekspor JSON</button><button class="g" data-a="imp">Impor JSON</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div>
 <div class="card"><b>Riwayat ${mlabel(V)}</b>${H.map(h=>`<div class="li"><span>${h.t}</span><small>${h.d}</small></div>`).join('')||'<p class="m">Belum ada.</p>'}</div>`}};
const TABS=[['home','Beranda'],['trx','Transaksi'],['bud','Anggaran'],['mon','Uang'],['more','Lainnya']];
function render(){const m=M();
 let h=`<div class="top m">Bulan: <b>${mlabel(V)}</b></div>`;
 if(V!=ym0())h+='<p class="warn">Bulan lalu: perubahan di sini tidak mengubah bulan berikutnya.</p>';
 if(Date.now()-S.bk>6048e5)h+='<p class="warn">Belum ekspor cadangan 7 hari terakhir. Buka menu Lainnya.</p>';
 $('#v').innerHTML=h+views[T](m);
 $('#nav').innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join('');
 const ms=$('#ms');if(ms)ms.onchange=e=>{V=e.target.value;TF=blankF();render()}}

const A={close,
tab(i){T=i;render()},tc(i){TC=i;render()},rf(){TF=blankF();render()},
addMonth(){const ks=Object.keys(S.months).sort(),l=ks[ks.length-1],d=new Date(+l.slice(0,4),+l.slice(5),1),nx=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 sheet('Tambah bulan',[{k:'ym',l:'Bulan',t:'month',v:nx},{k:'cp',l:'Isi awal',t:'sel',o:[['1','Salin dari bulan sebelumnya'],['0','Mulai kosong']]}],
 v=>{if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(v.ym))return'Pilih bulan yang valid.';if(S.months[v.ym])return'Bulan '+mlabel(v.ym)+' sudah ada.';newMonth(v.ym,v.cp=='1');TF=blankF()})},
nm1(){newMonth(ym0(),1);close();render()},nm0(){newMonth(ym0(),0);close();render()},
addTx(){const m=M();if(!m.cats.length)return alert('Buat kategori dulu di menu Anggaran.');
 sheet('Pengeluaran',[{k:'c',l:'Kategori',t:'sel',o:m.cats.map(c=>[c.id,c.n]),v:TC||m.cats[0].id},{k:'p',l:'Rencana',t:'sel'},{k:'l',l:'Keterangan'},{k:'a',l:'Jumlah',t:'num'},{k:'s',l:'Sumber',t:'sel',o:SO()},{k:'d',l:'Tanggal',t:'date',v:dd()},{k:'n',l:'Catatan'}],
 v=>{if(!v.a)return'Isi jumlah.';const pl=m.plans.find(x=>x.id==v.p);if(!v.l&&!pl)return'Isi keterangan.';if(!v.d.startsWith(V))return'Tanggal harus di bulan '+mlabel(V);
  const w=[],c=m.cats.find(x=>x.id==v.c);if(v.a>avail(m,v.s))w.push('Melebihi uang tersedia di '+sn(v.s)+'.');if(spent(m,v.c)+v.a>c.b)w.push('Melebihi anggaran kategori.');if(m.tb&&spent(m)+v.a>m.tb)w.push('Melebihi total anggaran.');
  if(w.length&&!confirm(w.join('\n')+'\nLanjutkan?'))return false;
  const id=uid();m.tx.push({id,d:v.d,ty:'out',c:v.c,p:pl?pl.id:null,l:v.l||pl.n,a:v.a,s:v.s,n:v.n});if(pl){pl.st=1;pl.tx=id}save()},
 f=>{const pick=()=>{const x=m.plans.find(q=>q.id==f.p.value);if(x){f.a.value=fmt(x.a);f.l.value=x.n}else{f.a.value='';f.l.value=''}},
  fill=()=>{f.p.innerHTML=m.plans.filter(x=>x.c==f.c.value&&!x.st).map(x=>`<option value="${x.id}">${esc(x.n)} – ${fmt(x.a)}</option>`).join('')+'<option value="_">Lainnya (tanpa rencana)</option>';pick()};
  f.c.onchange=fill;f.p.onchange=pick;fill()})},
delTx(i){if(!confirm('Hapus transaksi ini?'))return;const m=M();m.tx=m.tx.filter(t=>t.id!=i);m.plans.forEach(p=>{if(p.tx==i){p.st=0;delete p.tx}});save();render()},
addIn(){const m=M();sheet('Pemasukan',[{k:'l',l:'Keterangan'},{k:'a',l:'Jumlah',t:'num'},{k:'s',l:'Ke sumber',t:'sel',o:SO()},{k:'d',l:'Tanggal',t:'date',v:dd()}],
 v=>{if(!v.a||!v.l)return'Isi keterangan dan jumlah.';if(!v.d.startsWith(V))return'Tanggal harus di bulan '+mlabel(V);m.tx.push({id:uid(),d:v.d,ty:'in',l:v.l,a:v.a,s:v.s});save()})},
trf(){const m=M();sheet('Transfer',[{k:'from',l:'Dari',t:'sel',o:SO()},{k:'to',l:'Ke',t:'sel',o:SO(),v:(S.sources[1]||S.sources[0]).id},{k:'a',l:'Jumlah',t:'num'},{k:'d',l:'Tanggal',t:'date',v:dd()}],
 v=>{if(v.from==v.to)return'Sumber asal dan tujuan harus berbeda.';if(!v.a)return'Isi jumlah.';if(v.a>avail(m,v.from)&&!confirm('Melebihi uang tersedia (di luar cadangan). Lanjutkan?'))return false;m.tr.push({id:uid(),d:v.d,from:v.from,to:v.to,a:v.a});save()})},
editTb(){const m=M();sheet('Total anggaran',[{k:'a',l:'Jumlah',t:'num',v:m.tb}],v=>{if(v.a!=m.tb){m.bh.push({d:today(),f:m.tb,t:v.a});m.tb=v.a;save()}})},
addCat(){const m=M();sheet('Kategori baru',[{k:'n',l:'Nama'},{k:'b',l:'Anggaran',t:'num'}],v=>{if(!v.n)return'Isi nama.';m.cats.push({id:uid(),n:v.n,b:v.b});save()})},
editCat(i){const c=M().cats.find(x=>x.id==i);sheet('Ubah kategori',[{k:'n',l:'Nama',v:c.n},{k:'b',l:'Anggaran',t:'num',v:c.b}],v=>{if(!v.n)return'Isi nama.';c.n=v.n;c.b=v.b;save()})},
delCat(i){const m=M();if(m.tx.some(t=>t.c==i))return alert('Kategori ini punya transaksi dan tidak bisa dihapus.');if(!confirm('Hapus kategori beserta rencananya?'))return;m.cats=m.cats.filter(c=>c.id!=i);m.plans=m.plans.filter(p=>p.c!=i);save();render()},
addPlan(i){const m=M();sheet('Rencana baru',[{k:'n',l:'Nama (mis. Listrik)'},{k:'a',l:'Jumlah',t:'num'},{k:'k',l:'Berapa kali (mis. 2 untuk dua kali sebulan)',t:'num',v:1}],v=>{if(!v.n||!v.a)return'Isi nama dan jumlah.';for(let j=0;j<Math.min(v.k||1,31);j++)m.plans.push({id:uid(),c:i,n:v.n,a:v.a,st:0});save()})},
editPlan(i){const p=M().plans.find(x=>x.id==i);sheet('Ubah rencana',[{k:'n',l:'Nama',v:p.n},{k:'a',l:'Jumlah',t:'num',v:p.a}],v=>{if(!v.n||!v.a)return'Isi nama dan jumlah.';p.n=v.n;p.a=v.a;save()})},
delPlan(i){const m=M(),p=m.plans.find(x=>x.id==i);if(p.st)return alert('Rencana sudah dibayar. Hapus transaksinya dulu.');if(!confirm('Hapus rencana?'))return;m.plans=m.plans.filter(x=>x.id!=i);save();render()},
editBal(i){const m=M(),cur=bal(m,i);sheet('Ubah saldo '+sn(i),[{k:'a',l:'Saldo baru',t:'num',v:cur}],v=>{if(v.a!=cur){m.adj.push({id:uid(),d:today(),s:i,from:cur,to:v.a});save()}})},
addBank(){sheet('Rekening baru',[{k:'n',l:'Nama bank'}],v=>{if(!v.n)return'Isi nama.';S.sources.push({id:uid(),n:v.n});save()})},
renSrc(i){const s=S.sources.find(x=>x.id==i);sheet('Ubah nama sumber',[{k:'n',l:'Nama',v:s.n}],v=>{if(!v.n)return'Isi nama.';s.n=v.n;save()})},
delSrc(i){if(S.sources.length<=1)return alert('Minimal harus ada satu sumber uang.');
 const used=Object.values(S.months).some(m=>(m.op[i]||0)!=0||m.tx.some(t=>t.s==i)||m.tr.some(x=>x.from==i||x.to==i)||m.adj.some(a=>a.s==i)||m.res.some(r=>r.s==i));
 if(used)return alert('Sumber ini sudah punya saldo, transaksi, transfer, atau cadangan (di bulan mana pun), jadi tidak bisa dihapus.');
 if(!confirm('Hapus sumber "'+sn(i)+'"?'))return;S.sources=S.sources.filter(s=>s.id!=i);save();render()},
addRes(){const m=M();sheet('Cadangan baru',[{k:'n',l:'Untuk apa'},{k:'a',l:'Jumlah',t:'num'},{k:'s',l:'Sumber',t:'sel',o:SO()}],v=>{if(!v.n||!v.a)return'Isi tujuan dan jumlah.';m.res.push({id:uid(),n:v.n,a:v.a,s:v.s});save()})},
editRes(i){const r=M().res.find(x=>x.id==i);sheet('Ubah cadangan',[{k:'n',l:'Untuk apa',v:r.n},{k:'a',l:'Jumlah',t:'num',v:r.a},{k:'s',l:'Sumber',t:'sel',o:SO(),v:r.s}],v=>{if(!v.n||!v.a)return'Isi tujuan dan jumlah.';Object.assign(r,v);save()})},
delRes(i){if(!confirm('Hapus cadangan?'))return;const m=M();m.res=m.res.filter(r=>r.id!=i);save();render()},
exp(){S.bk=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='budget-backup-'+today()+'.json';a.click();render()},
imp(){const fi=$('#fi');fi.onchange=async()=>{try{const d=JSON.parse(await fi.files[0].text());if(!d.sources||!d.months)throw 0;
 const n=Object.values(d.months).reduce((t,m)=>t+m.tx.length,0);if(!confirm(`Impor: ${Object.keys(d.months).length} bulan, ${d.sources.length} sumber, ${n} transaksi.\nData sekarang akan DIGANTI. Lanjutkan?`))return;
 S=d;save();V=Object.keys(S.months).sort().pop();render()}catch(e){alert('File tidak valid.')}};fi.click()}};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)};

if(!Object.keys(S.months).length)newMonth(ym0(),0);
V=S.months[ym0()]?ym0():Object.keys(S.months).sort().pop();
render();
if(!S.months[ym0()])modal(`<h3>Bulan baru: ${mlabel(ym0())}</h3><p>Belum ada data anggaran untuk bulan ini. Saldo awal akan diambil dari saldo akhir bulan lalu.</p><div class="row"><button data-a="nm1">Salin dari bulan lalu</button><button class="g" data-a="nm0">Mulai kosong</button></div><p class="m">Salin: anggaran, kategori, rencana (belum dibayar), dan cadangan.</p>`);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
